# Hantek 2D82 — first-stage firmware
# UART shell on USART1 (PA9 TX / PA10 RX, 115200 8N1).
# Proves: shell reachable, backlight (PA8), buzzer (PC7) all working.

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SHELL_LOG_BACKEND=n

# USB diagnostics: keep UART console on USART1 and add a CDC ACM port for logs.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# Hantek vendor DFU bootloader occupies 0x08000000..0x08004FFF (20 KB).
# App must link from 0x08005000 so the vector table is at the right address
# when the bootloader jumps to slot0 (reads SP from [0x08005000], PC from [0x08005004]).
CONFIG_FLASH_LOAD_OFFSET=0x5000

CONFIG_AW2_BACKLIGHT=n
CONFIG_AW2_LCD=y
CONFIG_AW2_LCD_DEBUG=n
CONFIG_AW2_RENODE_DETECT=y
CONFIG_AW2_FPGA=y
CONFIG_AW2_DMM=y
CONFIG_AW2_BATTERY=y
CONFIG_AW2_CALIBRATION=y
CONFIG_AW2_KEYPAD=y
CONFIG_AW2_PROBE_COMP=n
CONFIG_AW2_USB=y
CONFIG_AW2_USB_DIAG=y
CONFIG_AW2_AWG=n
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KBD_MATRIX=y
CONFIG_DMA=n
CONFIG_PWM=n
CONFIG_DISPLAY=y

# LVGL — issue #125: partial-render buffers sized close to the ~8KB/4096px target.
# This Zephyr LVGL module (modules/lvgl/Kconfig.memory) only offers LV_Z_VDB_SIZE as
# a PERCENTAGE of hor_res*ver_res, not an absolute pixel/byte count — there's no
# CONFIG_LV_Z_DISPLAY_BUFFER_SIZE in this Zephyr version. 6% of 320x240 = 4608px =
# 9216 bytes/buffer (closest percentage to the 4096px/8KB target; 5% undershoots to
# 3840px/7.5KB). LV_Z_DOUBLE_VDB gives exactly 2 buffers (buf0/buf1) — this module
# has no static-alloc path for a 3rd buffer, so triple-buffering from the issue text
# isn't available without hand-rolling buffer management outside lvgl.c; double
# buffering (render into buf[N+1] while buf[N] flushes) already captures the main
# benefit. 2 × 9KB = 18KB, well within the 24KB budget the issue sets aside.
# Render mode is LV_DISPLAY_RENDER_MODE_PARTIAL (lvgl.c lvgl_allocate_rendering_buffers_static),
# i.e. flush_cb (a2k_board lcd.c: zd_write) is called once per buffer, not full-screen.
CONFIG_LVGL=y
CONFIG_LV_Z_VDB_SIZE=6
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_AUTO_INIT=y
# 256KB LVGL heap — unconstrained for Renode testing (sram0 extended to 1MB in DTS)
CONFIG_LV_Z_MEM_POOL_SIZE=262144
# Large stacks — no RAM pressure in emulation
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_IDLE_STACK_SIZE=4096
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
