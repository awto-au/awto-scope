# Optional first_stage config overlay: enable DMA-backed paths.
#
# Use with west via EXTRA_CONF_FILE, for example:
# west build -b hantek_2d82 code/first_stage -- -DEXTRA_CONF_FILE=prj_dma.conf
#
# Keep this overlay off for baseline Renode runs unless you explicitly want to
# exercise hardware-only code paths.

CONFIG_DMA=y
CONFIG_AW2_HW_VALIDATED=y
