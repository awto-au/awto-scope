# Applied to BOTH the mcuboot image and the app app image by the
# mcuboot-hantek_2d82 snippet (CONFIG_BOOTLOADER_MCUBOOT and
# CONFIG_FLASH_LOAD_OFFSET exist in both Kconfig trees; the mcuboot child
# image simply ignores/ends up with the same value it would have had anyway).
#
# CONFIG_BOOTLOADER_MCUBOOT=y selects Zephyr's USE_DT_CODE_PARTITION, which
# derives the app's link address from the zephyr,code-partition chosen node
# (defaults to slot0_partition when MCUboot is enabled, i.e. 0x0800C000, from
# boards/hantek_2d82.overlay in this snippet) — FLASH_LOAD_OFFSET becomes
# read-only/DT-derived at that point and must NOT be assigned a literal value
# here: an explicit `CONFIG_FLASH_LOAD_OFFSET=0` (tried during bring-up of
# this variant) silently wins over the DT-derived value and links the app at
# flash offset 0 — i.e. on top of MCUboot itself. Leaving it unset is correct;
# do not reintroduce an explicit value even to "override" app's own
# prj.conf 0x5000 default (see below for how that conflict is actually
# avoided).
#
# The Kconfig conflict with app/prj.conf's CONFIG_FLASH_LOAD_OFFSET=0x5000
# (Option B's default) does not need resolving here: once
# CONFIG_BOOTLOADER_MCUBOOT selects USE_DT_CODE_PARTITION, FLASH_LOAD_OFFSET
# is no longer user-configurable (Kconfig.zephyr: "hex ... if !USE_DT_CODE_PARTITION"),
# so prj.conf's assignment is simply not applied rather than conflicting —
# confirmed by a clean build with no Kconfig warnings.
#
# CONFIG_SINGLE_APPLICATION_SLOT is intentionally NOT set here — that symbol
# only exists inside MCUboot's own Kconfig tree (subsys/dfu), not the app's;
# setting it in a conf fragment shared with the app image produces an
# "assigned to undefined symbol" warning. Single-slot mode is selected on the
# MCUboot side alone, via sysbuild.conf's SB_CONFIG_MCUBOOT_MODE_SINGLE_APP
# (which sysbuild expands into MCUboot's own single_slot.conf automatically).

CONFIG_BOOTLOADER_MCUBOOT=y
