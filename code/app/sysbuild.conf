# Sysbuild configuration — Option C (MCUboot) variant.
#
# Inert unless the build is invoked with --sysbuild (plain `west build` without
# --sysbuild ignores this file entirely and produces the Option B single-image
# build, app @ 0x08005000, vendor bootloader preserved — see prj.conf).
#
# See docs/hantek/flash-layout.md, "Option C" for the full picture and the
# exact build/flash/recovery commands.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Single-slot: MCUboot only ever boots slot0_partition. No slot1/OTA staging,
# no scratch partition — smallest realistic flash commitment for a first cut
# on a 512 KB part. The intended field-update path is MCUboot's own serial
# recovery (CONFIG_MCUBOOT_SERIAL, USART1) rather than an in-band OTA swap —
# NOT YET ENABLED this pass (see sysbuild/mcuboot.conf for why); until it is,
# updates require SWD, same as the initial install. See
# docs/hantek/flash-layout.md, "Option C — known gaps".
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# ED25519: smallest code-size signature scheme MCUboot supports (vs RSA/ECDSA
# P256), and the STM32F103 here has no hardware crypto accelerator — every
# scheme runs in software, so the smaller one wins on flash footprint. Uses
# MCUboot's own software SHA256 for the image hash (also software on this MCU).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y

# Signing key intentionally left at MCUboot's own default
# ($ZEPHYR_MCUBOOT_MODULE_DIR/root-ed25519.pem, a well-known public dev/sample
# key shipped with every MCUboot checkout). Fine for Renode verification and
# bring-up; anyone shipping signed field updates for real must generate their
# own key (imgtool keygen) and override SB_CONFIG_BOOT_SIGNATURE_KEY_FILE —
# see docs/hantek/flash-layout.md, "Option C" for the exact command.
