# MCUboot child-image Kconfig fragment for the hantek_2d82 Option C (MCUboot)
# variant. Merged on top of MCUboot's own default prj.conf + single_slot.conf
# (selected automatically by sysbuild via SB_CONFIG_MCUBOOT_MODE_SINGLE_APP,
# see ../sysbuild.conf).
#
# STM32F103 has no hardware crypto accelerator — mbedTLS's software SHA256 +
# software Ed25519 verify are used automatically by MCUboot's crypto glue when
# CONFIG_BOOT_SIGNATURE_TYPE_ED25519 is selected (set via sysbuild.conf, not
# here — it's a sysbuild-level Kconfig that propagates into this child image).

# Serial recovery (CONFIG_MCUBOOT_SERIAL / CONFIG_BOOT_SERIAL_UART) is NOT
# enabled yet — this is the biggest open item for Option C, tracked as a
# follow-on (see docs/hantek/flash-layout.md, "Option C — known gaps").
# MCUboot's serial_adapter.c requires (a) a `mcuboot_button0` GPIO alias in
# devicetree to detect the recovery-entry trigger at boot, which this board
# has no free/traced GPIO wired up for yet, and (b) CONFIG_UART_CONSOLE=n,
# since it repurposes the console UART (USART1) for the recovery protocol
# itself — app's board defconfig currently assumes the console is
# always available for shell/log output, so disabling it here would be a
# bigger, hardware-untested change than this first cut should make. Until
# this is wired up, Option C's update path is SWD-only (same as Option A),
# not the "no SWD needed again" story the design aims for — see the flash
# layout doc for what to check when that's tackled: a real spare GPIO for
# the button trigger, and how app's normal (non-recovery) boot path
# is meant to coexist with a console-owning bootloader.

# Keep MCUboot's own footprint down — every KB here is a KB not available to
# the app in the 32KB budget carved out by the mcuboot-hantek_2d82 snippet's
# boards/hantek_2d82.overlay.
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_BOOT_BOOTSTRAP=n
